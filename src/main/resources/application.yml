spring:
  application:
    name: talep-onay

  lifecycle:
    # Zarif kapanmada devam eden isteklere taninan sure.
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talep_onay}
    username: ${DB_USERNAME:talep}
    password: ${DB_PASSWORD:talep}
    hikari:
      maximum-pool-size: 10
      pool-name: talep-onay-havuz
      # Varsayilanlar cok comert. Veritabani yanit vermedigi anda istekler
      # havuzda birikip uygulamayi kilitliyor; asagidaki sinirlar sistemin
      # yavaslamak yerine hizlica hata donmesini sagliyor.
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          # Kacan bir sorgu tum havuzu tutmasin: 10 saniyede kesilir.
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Zarif kapanma: kapanma sinyali gelince yeni istek alinmiyor ama devam
  # edenler bitirilmeye calisiliyor. Olmadan, dagitim sirasinda islenmekte olan
  # istekler yarida kesilir ve kullanici sebepsiz hata gorur.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

talep:
  onay:
    # Bu tutari ASAN talepler, birim amiri onayladiktan sonra yonetici onayina duser.
    # Kurumun limiti degisince kod degismesin diye yapilandirmada.
    yonetici-limiti: ${ONAY_YONETICI_LIMITI:50000}

  jwt:
    # Uretimde JWT_SECRET ortam degiskeni ZORUNLU olarak verilir.
    # Asagidaki deger yalnizca yerel gelistirme icindir ve depoda gizli veri sayilmaz.
    gizli-anahtar: ${JWT_SECRET:yerel-gelistirme-icin-en-az-256-bit-uzunlugunda-gecici-anahtar-degeri}
    gecerlilik-suresi-dakika: ${JWT_TTL_DAKIKA:60}

logging:
  level:
    tr.ebrar.talep: INFO
