spring:
  application:
    name: talep-onay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talep_onay}
    username: ${DB_USERNAME:talep}
    password: ${DB_PASSWORD:talep}
    hikari:
      maximum-pool-size: 10
      pool-name: talep-onay-havuz

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

talep:
  jwt:
    # Uretimde JWT_SECRET ortam degiskeni ZORUNLU olarak verilir.
    # Asagidaki deger yalnizca yerel gelistirme icindir ve depoda gizli veri sayilmaz.
    gizli-anahtar: ${JWT_SECRET:yerel-gelistirme-icin-en-az-256-bit-uzunlugunda-gecici-anahtar-degeri}
    gecerlilik-suresi-dakika: ${JWT_TTL_DAKIKA:60}

logging:
  level:
    tr.ebrar.talep: INFO
