server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api istekleri arka uca. Tarayici acisindan her sey ayni kaynaktan geldigi
    # icin CORS hic devreye girmiyor. Konteyner disinda calisirken ayni isi
    # Vite'in dev proxy'si yapiyor.
    location /api/v1/ {
        proxy_pass http://uygulama:8080;
        proxy_http_version 1.1;
        # $host portu dusuruyor. Arka uc istegi localhost:80'e gelmis sanip
        # Origin: http://localhost:3000 ile eslestiremiyor, POST'u CORS diye 403'luyordu.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger'a on yuz uzerinden de ulasilabilsin; demo sirasinda pratik oluyor.
    location /swagger-ui/ { proxy_pass http://uygulama:8080; }
    location /swagger-ui.html { proxy_pass http://uygulama:8080; }
    location /v3/api-docs { proxy_pass http://uygulama:8080; }

    # Tek sayfa uygulamasi: bilinmeyen yollar index.html'e dusmeli, yoksa
    # /talepler/5 adresini yenileyince nginx 404 verir.
    #
    # Guvenlik basliklari yalnizca burada: /api yanitlarinda Spring Security'nin
    # kendi basliklari var, Swagger arayuzu ise satir ici betik kullandigi icin bu
    # CSP ile calismaz. HSTS burada yok; nginx 80'de duz HTTP dinliyor, TLS'i
    # sonlandiran katmana eklenmeli (bkz. docs/guvenlik.md).
    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
