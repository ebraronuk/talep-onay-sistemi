server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api istekleri arka uca. Tarayici acisindan her sey ayni kaynaktan geldigi
    # icin CORS hic devreye girmiyor. Konteyner disinda calisirken ayni isi
    # Vite'in dev proxy'si yapiyor.
    location /api/ {
        proxy_pass http://uygulama:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger'a on yuz uzerinden de ulasilabilsin; demo sirasinda pratik oluyor.
    location /swagger-ui/ { proxy_pass http://uygulama:8080; }
    location /swagger-ui.html { proxy_pass http://uygulama:8080; }
    location /v3/api-docs { proxy_pass http://uygulama:8080; }

    # Tek sayfa uygulamasi: bilinmeyen yollar index.html'e dusmeli, yoksa
    # /talepler/5 adresini yenileyince nginx 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
