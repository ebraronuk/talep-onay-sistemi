services:
  veritabani:
    image: postgres:16-alpine
    container_name: talep-onay-veritabani
    environment:
      POSTGRES_DB: talep_onay
      POSTGRES_USER: ${DB_USERNAME:-talep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talep}
    ports:
      - "5432:5432"
    volumes:
      - talep_onay_verisi:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d talep_onay"]
      interval: 3s
      timeout: 3s
      retries: 20

  uygulama:
    build:
      context: .
    container_name: talep-onay-uygulama
    depends_on:
      veritabani:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://veritabani:5432/talep_onay
      DB_USERNAME: ${DB_USERNAME:-talep}
      DB_PASSWORD: ${DB_PASSWORD:-talep}
      # Yalnizca yerel gelistirme icin. Uretim profilinde bu deger kabul edilmez.
      JWT_SECRET: ${JWT_SECRET:-yerel-gelistirme-icin-en-az-256-bit-uzunlugunda-gecici-anahtar-degeri}
    ports:
      - "8080:8080"

  on-yuz:
    build:
      context: ./frontend
    container_name: talep-onay-on-yuz
    depends_on:
      - uygulama
    ports:
      - "3000:80"

volumes:
  talep_onay_verisi:
