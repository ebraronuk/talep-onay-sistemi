name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arka-uc:
    name: Arka uc derleme ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # spotless:check validate fazinda, jacoco esigi verify fazinda calisiyor.
      # Yani bicim ihlali ve kapsam dususu de derlemeyi kirar.
      - name: Derle, denetle ve test et
        run: ./mvnw -B -ntp clean verify

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-raporlari
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  on-yuz:
    name: On yuz derleme ve test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testleri calistir
        run: npm test

      - name: Uretim derlemesi
        run: npm run build
