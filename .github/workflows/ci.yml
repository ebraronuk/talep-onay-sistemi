name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arka-uc:
    name: Arka uc derleme ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # spotless:check validate fazinda, jacoco esigi verify fazinda calisiyor.
      # Yani bicim ihlali ve kapsam dususu de derlemeyi kirar.
      - name: Derle, denetle ve test et
        run: ./mvnw -B -ntp clean verify

      # Mutasyon testi ayri profilde ve esikli: skor %72'nin altina duserse kirar.
      # Verify'dan sonra kosuyor, cunku derleme ve testler zaten gecmis olmali.
      - name: Mutasyon testi
        run: ./mvnw -B -ntp -Pmutasyon test

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-raporlari
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
          if-no-files-found: ignore

  on-yuz:
    name: On yuz derleme ve test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testleri calistir (kapsam tabani ile)
        run: npm run test:kapsam

      - name: Uretim derlemesi
        run: npm run build

      # Ilk yukleme butcesi. Su an ~77 KB gzip; kod bolunmeden eklenen agir bir
      # bagimlilik ya da sayfa bunu asarsa derleme kirilir.
      - name: Paket boyutu butcesi (JS < 120 KB gzip)
        run: |
          boyut=$(cat dist/assets/*.js | gzip -9 | wc -c)
          echo "JS toplam gzip: $boyut bayt"
          test "$boyut" -lt 122880

  uctan-uca:
    name: Uctan uca (docker compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # README'deki tek komutla kurulan yiginin aynisi: veritabani, arka uc, on yuz.
      # --wait saglik kontrolleri yesile donene kadar bekler.
      - name: Yigini ayaga kaldir
        run: docker compose up --build -d --wait

      - name: On yuz guvenlik basliklarini dogrula
        run: |
          curl -sSI http://localhost:3000/ | tee basliklar.txt
          grep -qi '^content-security-policy:' basliklar.txt
          grep -qi '^x-content-type-options: nosniff' basliklar.txt
          grep -qi '^x-frame-options: DENY' basliklar.txt

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright kur
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Uctan uca testler
        working-directory: frontend
        run: npm run e2e

      - name: Konteyner loglari
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Playwright raporunu yukle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-raporu
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
