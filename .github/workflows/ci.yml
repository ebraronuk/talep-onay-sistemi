name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arka-uc:
    name: Arka uc derleme ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # spotless:check validate fazinda, jacoco esigi verify fazinda calisiyor.
      # Yani bicim ihlali ve kapsam dususu de derlemeyi kirar.
      - name: Derle, denetle ve test et
        run: ./mvnw -B -ntp clean verify

      # Mutasyon testi ayri profilde ve esikli: skor %72'nin altina duserse kirar.
      # Verify'dan sonra kosuyor, cunku derleme ve testler zaten gecmis olmali.
      - name: Mutasyon testi
        run: ./mvnw -B -ntp -Pmutasyon test

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-raporlari
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
          if-no-files-found: ignore

  on-yuz:
    name: On yuz derleme ve test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testleri calistir (kapsam tabani ile)
        run: npm run test:kapsam

      - name: Uretim derlemesi
        run: npm run build

  docker:
    name: Docker imajlari derleniyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yalnizca derler, calistirmaz: README'deki "docker compose up --build"
      # komutunun en azindan derleme asamasi kirilmasin diye.
      - name: Imajlari derle
        run: docker compose build

      # nginx yapilandirmasi ve guvenlik basliklari gercekten ulasiyor mu.
      # 'uygulama' adi proxy_pass'te cozumlenebilmeli, yoksa nginx acilmaz.
      - name: On yuz basliklarini dogrula
        run: |
          docker build -t on-yuz-test frontend
          docker run -d --name on-yuz --add-host uygulama:127.0.0.1 -p 8081:80 on-yuz-test
          sleep 3
          curl -sSI http://localhost:8081/ | tee basliklar.txt
          grep -qi '^content-security-policy:' basliklar.txt
          grep -qi '^x-content-type-options: nosniff' basliklar.txt
          grep -qi '^x-frame-options: DENY' basliklar.txt
