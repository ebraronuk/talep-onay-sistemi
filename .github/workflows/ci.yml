name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arka-uc:
    name: Arka uc derleme ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derle ve test et
        run: ./mvnw -B -ntp clean verify

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-raporlari
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
