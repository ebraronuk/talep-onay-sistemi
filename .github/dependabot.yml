# Bagimlilik guncellemeleri haftalik olarak PR halinde gelir.
# Elle takip edilen guvenlik yamasi, takip edilmeyen guvenlik yamasidir.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Spring bagimliliklari birlikte yukselmeli; tek tek PR gelirse
      # surum uyumsuzlugu yasanip her biri ayri ayri kirilir.
      spring:
        patterns:
          - "org.springframework*"
      test-araclari:
        patterns:
          - "org.testcontainers*"
          - "org.mockito*"
          - "com.tngtech.archunit*"
          - "org.awaitility*"
    ignore:
      # Spring Boot 4'e gecis bilincli olarak ertelendi; proje 3.5 LTS hattinda
      # kaliyor (bkz. docs/decisions.md K-004). Dependabot her hafta ayni major
      # yukseltmeyi onerdiginde acik PR listesi kirmizi kaliyor ve gercek
      # guvenlik yamalari gurultude kayboluyor. Yama ve minor surumler gelmeye
      # devam ediyor; yalnizca major kapali.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # springdoc 3.x yalnizca Boot 4 ile calisiyor: Boot 3.5 uzerinde
      # ErrorMvcAutoConfiguration bean cakismasi verip uygulamayi acmiyor.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
      test-araclari:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "jsdom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Calisma zamani JDK surumu derleme surumuyle ayni kalmali. Java 21'den
      # cikilacaksa pom, CI ve Dockerfile birlikte guncellenir; Dockerfile'in
      # tek basina ilerlemesi derleme ile calisma zamanini birbirinden ayirir.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
